<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-label="Animated preview of a finished Short">
<!-- stream-to-shorts by Akshat96af. Copyright (c) 2026 Akshat96af. All rights reserved. -->
<title>What a finished Short looks like</title>
<defs>
  <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a63"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
  <linearGradient id="game" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7d6"/><stop offset=".55" stop-color="#f6c177"/><stop offset="1" stop-color="#2d6a4f"/></linearGradient>
  <clipPath id="scr"><rect x="12" y="12" width="336" height="616" rx="34"/></clipPath>
</defs>
<style>
  .f{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:900}
  .zoom{animation:punch 3s ease-in-out infinite;transform-origin:180px 420px}
  .flash{animation:flash 3s linear infinite}
  .car{animation:drive 3s linear infinite}
  .c1{animation:pop 3s infinite} .c2{animation:pop 3s infinite .5s} .c3{animation:pop 3s infinite 1s}
  .face{animation:react 3s ease-in-out infinite;transform-origin:180px 118px}
  @keyframes punch{0%,48%,100%{transform:scale(1)}55%{transform:scale(1.12)}70%{transform:scale(1.02)}}
  @keyframes flash{0%,49%,58%,100%{opacity:0}52%{opacity:.55}}
  @keyframes drive{0%{transform:translateX(-90px)}100%{transform:translateX(330px)}}
  @keyframes pop{0%,10%{fill:#ffd23f;font-size:33px}18%,100%{fill:#fff;font-size:28px}}
  @keyframes react{0%,45%,100%{transform:scale(1)}55%{transform:scale(1.08)}}
</style>
<rect x="0" y="0" width="360" height="640" rx="44" fill="#0e1118"/>
<g clip-path="url(#scr)">
  <rect x="12" y="12" width="336" height="190" fill="url(#cam)"/>
  <g transform="translate(0,34)"><g class="face"><circle cx="180" cy="118" r="44" fill="#e3a77e"/><ellipse cx="164" cy="108" rx="5" ry="7" fill="#1b1b1b"/>
    <ellipse cx="196" cy="108" rx="5" ry="7" fill="#1b1b1b"/><ellipse cx="180" cy="138" rx="14" ry="10" fill="#5a1f1f"/>
    <path d="M128 92 q52 -60 104 0" fill="#2b1d14"/><rect x="118" y="96" width="14" height="40" rx="7" fill="#222"/><rect x="228" y="96" width="14" height="40" rx="7" fill="#222"/></g></g>
  <g class="zoom">
    <rect x="12" y="202" width="336" height="426" fill="url(#game)"/>
    <rect x="12" y="470" width="336" height="60" fill="#3a3a3a"/><rect x="12" y="497" width="336" height="5" fill="#f4d35e"/>
    <g class="car"><rect x="0" y="448" width="86" height="34" rx="8" fill="#e63946"/><rect x="14" y="436" width="56" height="20" rx="6" fill="#ff8fa3"/>
      <circle cx="18" cy="484" r="9" fill="#111"/><circle cx="68" cy="484" r="9" fill="#111"/></g>
    <rect x="40" y="300" width="70" height="120" fill="#264653"/><rect x="240" y="260" width="80" height="160" fill="#2a9d8f"/>
  </g>
  <rect class="flash" x="12" y="202" width="336" height="426" fill="#fff"/>
  <rect x="40" y="34" width="280" height="64" rx="6" fill="#fff"/>
  <text x="180" y="62" text-anchor="middle" class="f" style="font-size:22px;fill:#111">HE DID NOT EXPECT</text>
  <text x="180" y="88" text-anchor="middle" class="f" style="font-size:22px;fill:#111">THAT ENDING</text>
  <text x="180" y="560" text-anchor="middle" class="f" style="font-size:28px;paint-order:stroke;stroke:#111;stroke-width:7px">
    <tspan class="c1" fill="#fff">NO </tspan><tspan class="c2" fill="#fff">WAY </tspan><tspan class="c3" fill="#fff">BRO</tspan></text>
</g>
<rect x="138" y="22" width="84" height="8" rx="4" fill="#0e1118"/>
</svg>
