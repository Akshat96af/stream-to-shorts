<title>How it works</title>
<style>
  .h{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:19px;fill:#fff} .d{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:15px;fill:#8b95a8}
  .k{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:15px;fill:#111}
  .flow{animation:dash 1s linear infinite} .n{animation:lift 2.5s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-16}}
  @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<rect width="1220" height="240" rx="20" fill="#0b0d14"/>
<g class="n" style="animation-delay:0.0s"><rect x="40" y="60" width="196" height="120" rx="18" fill="#141821" stroke="#7c5cff" stroke-width="3"/><circle cx="74" cy="96" r="14" fill="#7c5cff"/><text x="74" y="101" text-anchor="middle" class="k">1</text><text x="98" y="102" class="h">SOURCE</text><text x="60" y="148" class="d">live, VOD or file</text></g><line class="flow" x1="236" y1="120" x2="276" y2="120" stroke="#7c5cff" stroke-width="4" stroke-dasharray="8 8"/><g class="n" style="animation-delay:0.5s"><rect x="276" y="60" width="196" height="120" rx="18" fill="#141821" stroke="#ff5d8f" stroke-width="3"/><circle cx="310" cy="96" r="14" fill="#ff5d8f"/><text x="310" y="101" text-anchor="middle" class="k">2</text><text x="334" y="102" class="h">FIND</text><text x="296" y="148" class="d">replays · chat · voice</text></g><line class="flow" x1="472" y1="120" x2="512" y2="120" stroke="#ff5d8f" stroke-width="4" stroke-dasharray="8 8"/><g class="n" style="animation-delay:1.0s"><rect x="512" y="60" width="196" height="120" rx="18" fill="#141821" stroke="#ffd23f" stroke-width="3"/><circle cx="546" cy="96" r="14" fill="#ffd23f"/><text x="546" y="101" text-anchor="middle" class="k">3</text><text x="570" y="102" class="h">YOU CHECK</text><text x="532" y="148" class="d">frames + transcript</text></g><line class="flow" x1="708" y1="120" x2="748" y2="120" stroke="#ffd23f" stroke-width="4" stroke-dasharray="8 8"/><g class="n" style="animation-delay:1.5s"><rect x="748" y="60" width="196" height="120" rx="18" fill="#141821" stroke="#3ddc84" stroke-width="3"/><circle cx="782" cy="96" r="14" fill="#3ddc84"/><text x="782" y="101" text-anchor="middle" class="k">4</text><text x="806" y="102" class="h">RENDER</text><text x="768" y="148" class="d">hook · captions · beat</text></g><line class="flow" x1="944" y1="120" x2="984" y2="120" stroke="#3ddc84" stroke-width="4" stroke-dasharray="8 8"/><g class="n" style="animation-delay:2.0s"><rect x="984" y="60" width="196" height="120" rx="18" fill="#141821" stroke="#5aa9ff" stroke-width="3"/><circle cx="1018" cy="96" r="14" fill="#5aa9ff"/><text x="1018" y="101" text-anchor="middle" class="k">5</text><text x="1042" y="102" class="h">DELIVER</text><text x="1004" y="148" class="d">upload kit or uploader</text></g>
<text x="610" y="220" text-anchor="middle" class="d" style="font-size:13px">stream-to-shorts by Akshat96af</text>
