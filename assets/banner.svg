  @keyframes grow{0%{transform:scaleX(.15)}55%{transform:scaleX(1)}100%{transform:scaleX(.15)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes hl{0%{fill:#ffd23f}33%{fill:#ffffff}}
  @keyframes blink{50%{opacity:0}}
