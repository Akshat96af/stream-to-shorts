  .s{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:26px;fill:#c9d1e6}
  .b{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:16px;fill:#8b95a8;letter-spacing:3px}
  .pill{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:15px;fill:#111}
  .orb{animation:float 7s ease-in-out infinite} .orb2{animation:float 9s ease-in-out infinite reverse}
