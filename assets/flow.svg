<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="180" viewBox="0 0 1224 180" role="img" aria-label="ask, find, check, render, quality check, deliver, learn">
<!-- stream-to-shorts by Akshat96af. Copyright (c) 2026 Akshat96af. All rights reserved. -->
<title>The stream-to-shorts loop</title>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#1a1233"/></linearGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="run" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#ff5d8f"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
</defs>
<style>
  .h{font-family:'Segoe UI','SF Pro Display',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:17px;fill:#fff;letter-spacing:1.5px} .d{font-family:'Segoe UI','SF Pro Display',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px;fill:#9aa3ba}
  .k{font-family:'Segoe UI','SF Pro Display',Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:16px;fill:#0b0d12}
  .flow{animation:dash .7s linear infinite} .lift{animation:lift 3.2s ease-in-out infinite}
  .scan{animation:scan 5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-10}}
  @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1260px)}}
</style>
<rect width="1224" height="180" rx="22" fill="url(#fbg)"/>
<rect class="scan" x="0" y="160" width="180" height="3" rx="1.5" fill="url(#run)"/>
<g class="lift" style="animation-delay:0.0s"><rect x="20" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#7c5cff" stroke-width="2.5"/><rect x="20" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="96" cy="70" r="17" fill="#7c5cff"/><text x="96" y="76" text-anchor="middle" class="k">1</text><text x="96" y="112" text-anchor="middle" class="h">ASK</text><text x="96" y="132" text-anchor="middle" class="d">your goals</text></g><line class="flow" x1="174" y1="90" x2="190" y2="90" stroke="#7c5cff" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:0.25s"><rect x="192" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#a35cff" stroke-width="2.5"/><rect x="192" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="268" cy="70" r="17" fill="#a35cff"/><text x="268" y="76" text-anchor="middle" class="k">2</text><text x="268" y="112" text-anchor="middle" class="h">FIND</text><text x="268" y="132" text-anchor="middle" class="d">rewatched moments</text></g><line class="flow" x1="346" y1="90" x2="362" y2="90" stroke="#a35cff" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:0.5s"><rect x="364" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#ff5d8f" stroke-width="2.5"/><rect x="364" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="440" cy="70" r="17" fill="#ff5d8f"/><text x="440" y="76" text-anchor="middle" class="k">3</text><text x="440" y="112" text-anchor="middle" class="h">CHECK</text><text x="440" y="132" text-anchor="middle" class="d">like an editor</text></g><line class="flow" x1="518" y1="90" x2="534" y2="90" stroke="#ff5d8f" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:0.75s"><rect x="536" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#ff8a4c" stroke-width="2.5"/><rect x="536" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="612" cy="70" r="17" fill="#ff8a4c"/><text x="612" y="76" text-anchor="middle" class="k">4</text><text x="612" y="112" text-anchor="middle" class="h">RENDER</text><text x="612" y="132" text-anchor="middle" class="d">hook · captions · beat</text></g><line class="flow" x1="690" y1="90" x2="706" y2="90" stroke="#ff8a4c" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:1.0s"><rect x="708" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#ffd23f" stroke-width="2.5"/><rect x="708" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="784" cy="70" r="17" fill="#ffd23f"/><text x="784" y="76" text-anchor="middle" class="k">5</text><text x="784" y="112" text-anchor="middle" class="h">QC</text><text x="784" y="132" text-anchor="middle" class="d">8-frame sheet</text></g><line class="flow" x1="862" y1="90" x2="878" y2="90" stroke="#ffd23f" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:1.25s"><rect x="880" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#3ddc84" stroke-width="2.5"/><rect x="880" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="956" cy="70" r="17" fill="#3ddc84"/><text x="956" y="76" text-anchor="middle" class="k">6</text><text x="956" y="112" text-anchor="middle" class="h">DELIVER</text><text x="956" y="132" text-anchor="middle" class="d">kit or upload</text></g><line class="flow" x1="1034" y1="90" x2="1050" y2="90" stroke="#3ddc84" stroke-width="3.5" stroke-dasharray="5 5"/><g class="lift" style="animation-delay:1.5s"><rect x="1052" y="34" width="152" height="112" rx="20" fill="#121624" stroke="#5aa9ff" stroke-width="2.5"/><rect x="1052" y="34" width="152" height="112" rx="20" fill="url(#gl)"/><circle cx="1128" cy="70" r="17" fill="#5aa9ff"/><text x="1128" y="76" text-anchor="middle" class="k">7</text><text x="1128" y="112" text-anchor="middle" class="h">LEARN</text><text x="1128" y="132" text-anchor="middle" class="d">from the views</text></g>
</svg>
